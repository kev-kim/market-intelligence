[project]
name = "market-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
description = "Korean Company Intelligence Platform — monorepo root"
dependencies = [
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]
