[project]
name = "market-intelligence-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.8.0",
    "dagster-webserver>=1.8.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "anthropic>=0.30.0",
    "openai>=1.40.0",
    "pgvector>=0.3.0",
    "pyyaml>=6.0.0",
    "simhash>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_intelligence_pipeline"]

[tool.dagster]
module_name = "market_intelligence_pipeline"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
